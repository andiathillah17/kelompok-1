<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick Star - Jadi Temanku?</title>
    <style>
        /* --- CSS STYLE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #7ED9FF; /* Biru laut Bikini Bottom */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Comic Sans MS', 'Verdana', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background-color: #FFB7D5; /* Pink Patrick */
            padding: 40px;
            border-radius: 30px;
            border: 8px solid #99FF00; /* Hijau celana Patrick */
            box-shadow: 0 15px 0px #D13B7E;
            width: 90%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        #main-gif {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 4px solid #fff;
        }

        h1 {
            color: #8C2E63;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px #fff;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 0px #555;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #555;
        }

        #yes-btn {
            background-color: #99FF00; /* Hijau Patrick */
            color: #333;
            z-index: 2;
        }

        #no-btn {
            background-color: #FF5252;
            color: white;
            position: absolute;
            transition: 0.15s ease;
            z-index: 2;
        }

        /* Dekorasi Tambahan */
        .flower {
            position: absolute;
            width: 50px;
            opacity: 0.5;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <img id="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnR5ejR3dm1vODl3ZnN4ZzVqbmR5eTV3eXN5eXN5eXN5eXN5ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l46Cy1rHbF9Z2fvMS/giphy.gif" alt="Patrick Star">
        <h1 id="question">Apakah kamu mau jadi temanku?</h1>
        <div class="btn-group">
            <button id="yes-btn">Mau!</button>
            <button id="no-btn">Nggak</button>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const question = document.getElementById('question');
        const mainGif = document.getElementById('main-gif');

        // Fungsi agar tombol "No" menghindar saat didekati kursor
        noBtn.addEventListener('mouseover', () => {
            // Menghitung posisi acak di dalam jendela browser
            const maxWidth = window.innerWidth - noBtn.offsetWidth;
            const maxHeight = window.innerHeight - noBtn.offsetHeight;

            const randomX = Math.floor(Math.random() * maxWidth);
            const randomY = Math.floor(Math.random() * maxHeight);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // Aksi saat tombol "Yes" diklik
        yesBtn.addEventListener('click', () => {
            question.innerText = "Yeay! Sekarang kita sahabat selamanya!";
            // Mengganti GIF menjadi Patrick yang senang
            mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1bWh3eXF6bm9idHh6Z3YxeXJ6Z3YxeXJ6Z3YxeXJ6Z3YmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/xUPJPvjW9vS0ZpLTMk/giphy.gif";
            
            // Sembunyikan tombol No
            noBtn.style.display = 'none';
            
            // Tambahkan sedikit efek perayaan pada background
            document.body.style.backgroundColor = "#FFEB3B"; 
        });
    </script>
</body>
</html>
