<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengusir Malas</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #4facfe, #00c6fb);
      overflow:hidden;
    }

    .container{
      background:white;
      width:90%;
      max-width:500px;
      padding:30px;
      border-radius:30px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      position:relative;
    }

    h1{
      color:#0077cc;
      margin-top:10px;
      margin-bottom:15px;
      font-size:45px;
    }

    p{
      color:#444;
      font-size:20px;
      line-height:1.7;
      margin-bottom:25px;
    }

    .book{
      font-size:110px;
      cursor:pointer;
      user-select:none;
      transition:0.2s;
      display:inline-block;
    }

    .book:active{
      transform:scale(1.1);
    }

    .timer{
      margin-top:25px;
      font-size:28px;
      color:#0066cc;
      font-weight:bold;
    }

    .status{
      margin-top:18px;
      font-size:22px;
      color:#ff4444;
      font-weight:bold;
    }

    .stickers{
      position:absolute;
      width:100%;
      height:100%;
      top:0;
      left:0;
      pointer-events:none;
    }

    .sticker{
      position:absolute;
      font-size:40px;
    }

    .s1{
      top:15px;
      left:20px;
    }

    .s2{
      top:20px;
      right:25px;
    }

    .s3{
      bottom:20px;
      left:20px;
    }

    .s4{
      bottom:20px;
      right:25px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="stickers">
      <div class="sticker s1">🧠</div>
      <div class="sticker s2">💙</div>
      <div class="sticker s3">📚</div>
      <div class="sticker s4">✨</div>
    </div>

    <div class="book" id="book">📘</div>

    <h1>Pengusir<br>Malas</h1>

    <p>
      Tekan dan tahan buku ini selama mungkin 📖<br>
      Kalau dilepas sedikit saja, website akan mengingatkan kamu untuk fokus 😭
    </p>

    <div class="timer">
      ⏳ Waktu Bertahan:
      <span id="time">0</span> detik
    </div>

    <div class="status" id="status">
      Semangat belajar ✨
    </div>

  </div>

  <script>
    const book = document.getElementById("book");
    const timeText = document.getElementById("time");
    const statusText = document.getElementById("status");

    let timer = 0;
    let interval;
    let holding = false;

    function startHold(){

      if(holding) return;

      holding = true;

      statusText.innerHTML = "Bagus! Tetap fokus 🔥";

      interval = setInterval(() => {
        timer++;
        timeText.innerHTML = timer;
      },1000);
    }

    function stopHold(){

      if(!holding) return;

      holding = false;

      clearInterval(interval);

      statusText.innerHTML = "Ayo Fokus! 😭";

      const suara = new SpeechSynthesisUtterance("Ayo Fokus!");
      suara.lang = "id-ID";

      speechSynthesis.speak(suara);
    }

    // Laptop
    book.addEventListener("mousedown", startHold);
    book.addEventListener("mouseup", stopHold);
    book.addEventListener("mouseleave", stopHold);

    // HP
    book.addEventListener("touchstart", startHold);
    book.addEventListener("touchend", stopHold);

  </script>

</body>
</html>
