<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Jadi Teman?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        img {
            width: 150px;
            margin: 20px auto;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }
        #yesBtn:hover {
            background-color: #45a049;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 id="question">Apakah kau ingin menjadi teman ku?</h1>
    <img id="patrikImg" src="https://upload.wikimedia.org/wikipedia/id/thumb/1/1c/Patrick_Star.svg/1200px-Patrick_Star.svg.png" alt="Patrick">
    
    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onclick="sayNo()">No</button>
    </div>
</div>

<script>
    function sayYes() {
        document.getElementById('question').innerText = "Yey, terimakasih sudah menjadi teman ku";
        document.getElementById('noBtn').style.display = 'none'; // Sembunyikan tombol No
    }

    function sayNo() {
        // Buat tombol No lari ke posisi acak
        let x = Math.random() * (window.innerWidth - 100);
        let y = Math.random() * (window.innerHeight - 100);
        
        document.getElementById('noBtn').style.position = 'absolute';
        document.getElementById('noBtn').style.left = x + 'px';
        document.getElementById('noBtn').style.top = y + 'px';
    }
</script>

</body>
</html>
